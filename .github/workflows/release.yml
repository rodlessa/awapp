name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact: awapp-linux
            bin: awapp
          - name: windows
            os: windows-latest
            artifact: awapp-windows
            bin: awapp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.bin }} .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag/name
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          mkdir -p out
          cp dist/awapp-linux/awapp out/awapp-linux
          cp dist/awapp-windows/awapp.exe out/awapp-windows.exe
          tar -czf out/awapp-linux.tar.gz -C dist/awapp-linux awapp
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            Auto-built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - **awapp-linux** — Linux x86-64 (also as `.tar.gz`)
            - **awapp-windows.exe** — Windows x86-64 console binary

            Run with `./awapp -city "Your City"` (no API key needed).
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            out/awapp-linux
            out/awapp-linux.tar.gz
            out/awapp-windows.exe
          fail_on_unmatched_files: false
