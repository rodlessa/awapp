name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            artifact: awapp-linux
            bin: awapp
          - name: windows
            os: windows-latest
            artifact: awapp-windows
            bin: awapp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.bin }} .
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bin }}
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag/name
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package
        run: |
          mkdir -p out
          cp dist/awapp-linux/awapp out/awapp-linux
          cp dist/awapp-windows/awapp.exe out/awapp-windows.exe
          tar -czf out/awapp-linux.tar.gz -C dist/awapp-linux awapp
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            Auto-built from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - **awapp-linux** — Linux x86-64 (also as `.tar.gz`)
            - **awapp-windows.exe** — Windows x86-64 console binary

            Run with `./awapp -city "Your City"` (no API key needed).
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            out/awapp-linux
            out/awapp-linux.tar.gz
            out/awapp-windows.exe
          fail_on_unmatched_files: false

  aur:
    name: Publish AUR package
    # Only version tags push to the AUR (main-branch pre-releases do not).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up AUR SSH key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur_key\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Compute version and tarball checksum
        id: meta
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          curl -fsSL "https://github.com/rodlessa/awapp/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o /tmp/awapp.tar.gz
          echo "sha256=$(sha256sum /tmp/awapp.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Bump PKGBUILD and .SRCINFO
        run: |
          V="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.sha256 }}"
          sed -i "s/^pkgver=.*/pkgver=$V/" packaging/aur/PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('$SHA')/" packaging/aur/PKGBUILD
          sed -i "s|^\tpkgver = .*|\tpkgver = $V|" packaging/aur/.SRCINFO
          sed -i "s|^\tsource = .*|\tsource = awapp-$V.tar.gz::https://github.com/rodlessa/awapp/archive/refs/tags/v$V.tar.gz|" packaging/aur/.SRCINFO
          sed -i "s|^\tsha256sums = .*|\tsha256sums = $SHA|" packaging/aur/.SRCINFO
      - name: Push to AUR
        run: |
          set -e
          if git ls-remote ssh://aur@aur.archlinux.org/awapp.git HEAD >/dev/null 2>&1; then
            git clone ssh://aur@aur.archlinux.org/awapp.git /tmp/aurrepo
          else
            # new package: push from an empty repo so the AUR creates it
            mkdir -p /tmp/aurrepo
            git -C /tmp/aurrepo init
            git -C /tmp/aurrepo remote add origin ssh://aur@aur.archlinux.org/awapp.git
          fi
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aurrepo/
          cd /tmp/aurrepo
          git config user.name "awapp CI"
          git config user.email "awapp@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "awapp ${{ steps.meta.outputs.version }}"
          git push -u origin master
