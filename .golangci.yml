# golangci-lint configuration
run:
  timeout: 5m
linters:
  enable:
    - gofmt
    - govet
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - unconvert
    - errcheck
issues:
  exclude-rules:
    # Test helpers intentionally ignore some errors (e.g. captured stderr).
    - path: _test\.go
      linters:
        - errcheck
        - unconvert
